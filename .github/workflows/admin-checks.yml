name: Midad admin checks

on:
  push:
    branches: [admin-dashboard-dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check admin.js
          node --check analytics.js
      - name: Check required dashboard wiring
        run: |
          grep -q 'src="admin.js"' admin.html
          grep -q 'functions.invoke("bootstrap-admin")' admin.js
          grep -q 'app_metadata?.role !== "admin"' admin.js
          grep -q 'src="analytics.js"' index.html
          grep -q 'track-visitor' analytics.js
